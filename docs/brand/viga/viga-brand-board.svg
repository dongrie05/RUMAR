      <path fill="#101311" d="M74 93c0-25 20-45 45-45h274c25 0 45 20 45 45s-20 45-45 45H119c-25 0-45-20-45-45Z"/><path fill="#101311" d="M78 362 225 107c13-22 41-29 62-17 22 13 29 40 17 62L157 407c-13 22-40 29-62 17-22-13-29-40-17-62Z"/><path fill="#101311" d="m208 360 77-133c13-22 40-29 62-17 22 13 29 40 17 62l-77 133c-13 22-40 29-62 17-22-13-29-40-17-62Z"/>
    </g>
    <text x="220" y="230" fill="#101311" font-family="Arial, Helvetica, sans-serif" font-size="106" font-weight="700" letter-spacing="7">VIGA</text>

    <text x="0" y="402" fill="#72736E" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3">PRODUCT ACCENTS</text>
    <circle cx="44" cy="474" r="42" fill="#173437"/>
    <circle cx="148" cy="474" r="42" fill="#E9643A"/>
    <circle cx="252" cy="474" r="42" fill="#3FA77C"/>
    <circle cx="356" cy="474" r="42" fill="#A9DCCE"/>
    <text x="0" y="568" fill="#101311" font-family="Arial, Helvetica, sans-serif" font-size="25">The identity stays black and bone.</text>
    <text x="0" y="610" fill="#72736E" font-family="Arial, Helvetica, sans-serif" font-size="25">Colour belongs to status, action and navigation.</text>
  </g>

  <rect x="88" y="1378" width="1424" height="2" fill="#D6D5CF"/>
  <text x="88" y="1460" fill="#101311" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">VIGA</text>
  <text x="88" y="1505" fill="#72736E" font-family="Arial, Helvetica, sans-serif" font-size="25">A load-bearing identity: quiet, useful, unmistakable.</text>
  <text x="1512" y="1488" text-anchor="end" fill="#101311" font-family="Arial, Helvetica, sans-serif" font-size="25">16 px → app icon → van → workwear</text>
